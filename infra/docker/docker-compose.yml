name: rally-investor-matching

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: rally-investor-matching-api
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rally}:${POSTGRES_PASSWORD:-rally_dev_password}@db:5432/${POSTGRES_DB:-rally_investor_matching}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17-alpine
    container_name: rally-investor-matching-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rally_investor_matching}
      POSTGRES_USER: ${POSTGRES_USER:-rally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rally_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../data/schemas/vc_matching_schema_aws_with_mvp_compat.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../../data/patches/202607_formal_sample_import_extensions.sql:/docker-entrypoint-initdb.d/002_formal_import_extensions.sql:ro
      - ../../data/seeds/formal_investor_data.sql:/docker-entrypoint-initdb.d/003_formal_investor_data.sql:ro
      - ../../data/seeds/public_admin_test.sql:/docker-entrypoint-initdb.d/004_seed_public_admin_test.sql:ro
      - ../../data/patches/202607_clean_mojibake.sql:/docker-entrypoint-initdb.d/005_clean_mojibake.sql:ro
      - ../../data/patches/202607_refresh_investor_links.sql:/docker-entrypoint-initdb.d/006_refresh_investor_links.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rally} -d ${POSTGRES_DB:-rally_investor_matching}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
