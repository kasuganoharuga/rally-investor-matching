name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.set.outputs.frontend }}
      packages: ${{ steps.set.outputs.packages }}
      backend: ${{ steps.set.outputs.backend }}
      infra_validate: ${{ steps.set.outputs.infra_validate }}
      infra_integration: ${{ steps.set.outputs.infra_integration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'apps/web/.prettierrc'
              - 'apps/web/eslint.config.mjs'
            packages:
              - 'packages/**'
              - 'apps/mcp/**'
            backend:
              - 'apps/api/**'
              - 'pyproject.toml'
            infra_validate:
              - 'infra/**'
              - '**/Dockerfile*'
              - '.github/workflows/**'
            infra_integration:
              - 'data/schemas/**'
              - 'data/patches/**'
              - 'data/seeds/**'
              - 'infra/docker/**'
              - 'apps/web/src/features/auth/server/auth.ts'

      - name: Set job flags
        id: set
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "infra_validate=true" >> "$GITHUB_OUTPUT"
            echo "infra_integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          echo "packages=${{ steps.filter.outputs.packages }}" >> "$GITHUB_OUTPUT"
          echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
          echo "infra_validate=${{ steps.filter.outputs.infra_validate }}" >> "$GITHUB_OUTPUT"
          echo "infra_integration=${{ steps.filter.outputs.infra_integration }}" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint:web

      - name: Check frontend formatting
        run: pnpm format:check:web

      - name: Typecheck frontend
        run: pnpm typecheck:web

      - name: Build frontend
        run: pnpm build:web

  packages:
    name: Packages
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d packages && ! -d apps/mcp ]]; then
            echo "No packages/ or apps/mcp yet; skipping."
            exit 0
          fi
          pnpm --filter "./packages/**" --filter "./apps/mcp" lint
          pnpm --filter "./packages/**" --filter "./apps/mcp" typecheck

  backend:
    name: Backend
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ../..

      - name: Lint backend
        working-directory: apps/api
        run: python -m ruff check .

      - name: Check backend formatting
        working-directory: apps/api
        run: python -m ruff format --check .

      - name: Run backend tests
        working-directory: apps/api
        run: python -m pytest

  infra-validate:
    name: Infra validate
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.infra_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETTER_AUTH_SECRET: ci-placeholder-secret
      POSTGRES_DB: rally_investor_matching
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally_dev_password
      API_PORT: "8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          templates=(infra/cloudformation/*.yaml infra/cloudformation/*.yml)
          if ((${#templates[@]} == 0)); then
            echo "No CloudFormation templates found."
            exit 0
          fi
          python -m pip install --quiet cfn-lint
          # Warnings (e.g. unnecessary Fn::Sub) should not fail the cheap gate.
          cfn-lint --non-zero-exit-code error "${templates[@]}"

  infra-integration:
    name: Infra integration
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.infra_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: ci-placeholder-secret
      POSTGRES_DB: rally_investor_matching
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally_dev_password
      API_PORT: "8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start database
        run: docker compose -f infra/docker/docker-compose.yml up -d db

      - name: Wait for database schema
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.yml exec -T db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
              "SELECT to_regclass('public.investors')" | grep -q investors; then
              echo "investors table is present."
              exit 0
            fi
            sleep 2
          done
          echo "Database schema did not become ready in time." >&2
          docker compose -f infra/docker/docker-compose.yml logs db >&2 || true
          exit 1

      - name: Build API image
        run: docker compose -f infra/docker/docker-compose.yml build api

      - name: Start API and smoke health
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml up -d api
          for _ in $(seq 1 36); do
            if curl --fail --silent --show-error "http://127.0.0.1:${API_PORT}/health" >/dev/null; then
              echo "API health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "API health check failed." >&2
          docker compose -f infra/docker/docker-compose.yml logs api >&2 || true
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v

  ci:
    name: CI
    if: always()
    needs:
      - changes
      - frontend
      - packages
      - backend
      - infra-validate
      - infra-integration
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Detect changes failed: ${{ needs.changes.result }}" >&2
            exit 1
          fi
          results=(
            "${{ needs.frontend.result }}"
            "${{ needs.packages.result }}"
            "${{ needs.backend.result }}"
            "${{ needs.infra-validate.result }}"
            "${{ needs.infra-integration.result }}"
          )
          for result in "${results[@]}"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Required job finished with status: ${result}" >&2
                exit 1
                ;;
            esac
          done
          echo "All required jobs passed or were skipped."
