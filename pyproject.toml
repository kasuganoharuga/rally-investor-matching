[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-match-intelligence"
version = "0.1.0"
description = "Structured VC matching engine with an evidence-grounded RAG layer"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.57.0",
  "boto3>=1.34.0",
  "psycopg[binary]>=3.2.0",
  "pypdf>=6.0.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.20",
]

[tool.setuptools.packages.find]
where = ["apps/api"]

[project.scripts]
vcmi-build-artifacts = "app.tools.artifacts:main"
vcmi-load-postgres = "app.tools.postgres_loader:main"
vcmi-embed-bedrock = "app.tools.bedrock_embed:main"
vcmi-local-match = "app.services.matching_scoring:main"
vcmi-build-mvp-bundle = "app.tools.mvp_bundle:main"
vcmi-llm-smoke-test = "app.providers.llm:main"
vcmi-parse-founder = "app.services.founder_parser_service:main"
vcmi-init-local-db = "app.tools.unified_db:main"
vcmi-import-investor = "app.tools.investor_importer:main"
