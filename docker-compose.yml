services:
  db:
    image: postgres:17-alpine
    container_name: rally-investor-matching-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rally_investor_matching}
      POSTGRES_USER: ${POSTGRES_USER:-rally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rally_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rally} -d ${POSTGRES_DB:-rally_investor_matching}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
